name: Sync from upstream

on:
  schedule:
    - cron: '0 5 * * 1'  # Every Monday at 5am UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Add Upstream
        run: git remote add upstream https://github.com/HibiscusMC/HMCCosmetics.git

      - name: Fetch Upstream and Merge
        id: sync
        run: |
          git fetch upstream
          git checkout remapped
          git merge upstream/remapped
          BRANCH=sync-upstream-$(date +%Y%m%d)
          git checkout -b $BRANCH
          git push origin $BRANCH
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.sync.outputs.branch }}
          title: "🔄 Sync with upstream"
          body: "Merge upstream/remapped into remapped."
          base: remapped
