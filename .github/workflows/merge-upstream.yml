name: Sync from upstream

on:
  schedule:
    - cron: '0 5 * * 1'  # Every Monday at 5am UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Add Upstream
        run: git remote add upstream https://github.com/HibiscusMC/HMCCosmetics.git

      - name: Fetch Upstream and Merge
        id: sync
        run: |
          git fetch upstream
          git checkout remapped

          # Ensure sync-upstream branch exists and is clean
          git branch -D sync-upstream || true
          git checkout -b sync-upstream
          
          # Merge in upstream changes
          git merge --no-commit --no-ff upstream/remapped || true

          if git diff --quiet; then
            echo "No changes detected from upstream."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "🔄 Sync with upstream/remapped"
            git push origin sync-upstream --force
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create PR
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: sync-upstream
          title: "🔄 Sync with upstream"
          body: "Merge upstream/remapped into remapped."
          base: remapped
